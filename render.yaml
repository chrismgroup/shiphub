services:
  - type: web
    name: shiphub-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shiphub-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SHIPHUB_OWNERS_API_BASE_URL
        sync: false
      - key: SHIPHUB_OWNERS_API_KEY
        sync: false

databases:
  - name: shiphub-db
    plan: free
