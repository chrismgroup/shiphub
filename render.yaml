services:
  - type: web
    name: shiphub-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: shiphub-db
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SHIPHUB_OWNERS_API_BASE_URL
        sync: false
      - key: SHIPHUB_OWNERS_API_KEY
        sync: false

  - type: web
    name: shiphub-marketplace
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/vessel-marketplace run build
    startCommand: node artifacts/vessel-marketplace/server/serve.js
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: EXPO_PUBLIC_API_URL
        value: https://shiphub-api.onrender.com/api
      - key: EXPO_PUBLIC_DOMAIN
        value: shiphub-marketplace.onrender.com

databases:
  - name: shiphub-db
    plan: free
