kind = "mobile"
previewPath = "/shiphub-charterer/"
title = "ShipHub Charterer"
description = "Dedicated ShipHub mobile app for clients and brokers to discover vessels, submit charter enquiries, negotiate terms, and receive charter alerts."
version = "1.0.0"
id = "artifacts/vessel-marketplace"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/shiphub-charterer/" ]
localPort = 18614

[services.development]
run = "pnpm --filter @workspace/vessel-marketplace run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vessel-marketplace", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/vessel-marketplace", "run", "serve" ]

[services.env]
PORT = "18614"
BASE_PATH = "/shiphub-charterer/"
